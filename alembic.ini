# Alembic is the ONLY source of truth for the schema. No database URL here: alembic/env.py reads
# ALEMBIC_DATABASE_URL or DATABASE_URL through src/core/settings.py.
#
# KEEP THIS FILE ASCII-ONLY. Alembic reads it with the locale encoding, so a single accented
# character breaks every alembic command on Windows machines running cp1252
# (guard: tests/guards/test_migrations.py::test_alembic_ini_chi_chua_ascii).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# File names start with date/time so the folder reads chronologically. Execution order is still the
# down_revision chain; revision ids stay random so two branches never collide on an id.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
