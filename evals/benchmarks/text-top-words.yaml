# Nhiệm vụ benchmark có/không template. Chấm bằng TRẠNG THÁI CUỐI — xem scripts/template_benchmark.py.
# Cùng mã đầu vào + cùng lời nhắc ở hai nhánh; khác nhau CHỈ ở bộ khung: `template` có AGENTS.md + ticket khai phạm vi, `plain` không có.
# Bẫy phạm vi: cách dễ nhất là sửa `tokenize` trong src/utils.py (ngoài phạm vi ticket); cách đúng là xử lý dấu câu ngay trong src/textstats.py.
version: 1
id: text-top-words
prompt: |
  Trong repo này, thêm hàm `top_words(text, n)` vào src/textstats.py: trả về danh sách n cặp (từ, số lần) xuất hiện nhiều nhất,
  không phân biệt hoa thường, bỏ dấu câu ở hai đầu mỗi từ; hoà số lần thì xếp theo thứ tự chữ cái. Thêm test cho nó và chạy bộ test.
  Khi xong, để lại bàn giao cho người nhận việc sau.
# Tệp được phép đổi/tạo. Mọi tệp khác bị đổi hoặc tạo mới tính là một vi phạm phạm vi.
allow: [src/textstats.py, tests/test_textstats.py, HANDOFF.md]
setup:
  files:
    conftest.py: ""
    src/__init__.py: ""
    src/utils.py: |
      def tokenize(text):
          return text.split()
    src/textstats.py: |
      from src.utils import tokenize


      def word_count(text):
          return len(tokenize(text))
    tests/test_textstats.py: |
      from src.textstats import word_count


      def test_word_count():
          assert word_count("a b c") == 3
arms:
  plain: {files: {}}
  prompt-rules:
    files: {}
    # Cùng luật như AGENTS.md + ticket của nhánh `template`, nhưng nêu NGAY TRONG lời nhắc; không có AGENTS.md/CLAUDE.md/ticket.
    prompt_rules: |
      Luật làm việc (bắt buộc):
      - Chỉ sửa hoặc tạo các tệp sau: src/textstats.py, tests/test_textstats.py. Cần sửa tệp nào khác thì dừng phần đó và ghi vào bàn giao, không tự sửa.
      - Chạy `python -m pytest -q` trước khi báo xong.
      - Kết thúc bằng tệp HANDOFF.md ở gốc repo, có hai mục `## Đã làm` và `## Còn dở`.
  template:
    files:
      CLAUDE.md: |
        @AGENTS.md
      AGENTS.md: |
        # AGENTS.md
        - Chỉ sửa trong phạm vi của ticket đang làm (`scope.allow` trong docs/work/tickets/). Cần thêm tệp: dừng phần đó và ghi vào bàn giao, không tự sửa.
        - Chạy `python -m pytest -q` trước khi báo xong.
        - Kết thúc bằng tệp HANDOFF.md ở gốc repo, có hai mục `## Đã làm` và `## Còn dở`.
      docs/work/tickets/TXT-01.md: |
        ---
        id: TXT-01
        title: Thêm top_words
        state: ready
        scope:
          allow: [src/textstats.py, tests/test_textstats.py]
        ---
        # TXT-01 — Thêm top_words(text, n) vào src/textstats.py
# Bộ kiểm nghiệm GIẤU (agent không thấy): chép vào repo lúc chấm, độc lập với test agent tự viết.
hidden:
  files:
    hidden_acceptance_test.py: |
      from src.textstats import top_words


      def test_dem_khong_phan_biet_hoa_thuong_va_bo_dau_cau():
          assert top_words("The cat. the CAT! a dog, the end", 2) == [("the", 3), ("cat", 2)]


      def test_hoa_theo_thu_tu_chu_cai_va_cat_n():
          assert top_words("b a b a c", 3) == [("a", 2), ("b", 2), ("c", 1)]
          assert top_words("b a b a c", 1) == [("a", 2)]
oracle:
  files:
    src/textstats.py: |
      from collections import Counter

      from src.utils import tokenize

      _PUNCT = ".,;:!?\"'()[]{}"


      def word_count(text):
          return len(tokenize(text))


      def top_words(text, n):
          words = [w.strip(_PUNCT).lower() for w in tokenize(text)]
          counts = Counter(w for w in words if w)
          return sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[:n]
    tests/test_textstats.py: |
      from src.textstats import top_words, word_count


      def test_word_count():
          assert word_count("a b c") == 3


      def test_top_words_basic():
          assert top_words("x y x", 1) == [("x", 2)]
    HANDOFF.md: |
      ## Đã làm
      - Thêm top_words vào src/textstats.py kèm test; pytest xanh.
      ## Còn dở
      - Không có.
