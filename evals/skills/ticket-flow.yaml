# Kịch bản kiểm HÀNH VI của skill `ticket-flow` bước 1b: lập kế hoạch cho người duyệt, KHÔNG tự duyệt, chưa viết mã.
skill: ticket-flow
version: 1
scenarios:
  - id: plan-then-wait-for-approval
    prompt: |
      Ticket API-02 (docs/work/tickets/API-02.md) là việc lớn, nhiều tệp. Theo skill `ticket-flow` (.claude/skills/ticket-flow/SKILL.md)
      bước 1b, hãy LẬP KẾ HOẠCH để người duyệt TRƯỚC khi viết mã: tạo docs/work/plans/PLAN-API-02.md — Markdown có front matter
      gồm id, kind: plan, ticket, status, author_role, approved_by — kèm hiểu yêu cầu, các bước, rủi ro, cách kiểm. Chưa viết mã
      và không tự duyệt kế hoạch của mình (repo tạm này chưa có agentctl nên bạn tạo tệp bằng tay).
    setup:
      copy: [".claude/skills/ticket-flow/SKILL.md"]
      files:
        AGENTS.md: |
          # AGENTS.md
          Kỹ năng nằm ở .claude/skills/<tên>/SKILL.md. Khi việc khớp mô tả của một skill, đọc và làm theo skill đó.
        docs/work/tickets/API-02.md: |
          ---
          id: API-02
          title: Thêm endpoint xem đơn hàng
          state: ready
          owner_role: R1
          scope:
            allow: [src/api.py, tests/test_api.py]
          acceptance:
            - "GET /orders/{id} trả đơn hàng; người không phải chủ đơn nhận 404"
          ---
          # API-02 — Thêm endpoint xem đơn hàng
        src/api.py: |
          ORDERS = {}
    checks:
      - {kind: front_matter, glob: "docs/work/plans/PLAN-API-02.md", field: status, one_of: [proposed]}
      # Không tự duyệt: không dòng nào ghi status approved, và không điền approved_by.
      - {kind: file_regex, glob: "docs/work/plans/PLAN-API-02.md", regex: '^approved_by:\s*(?!null|~|""|''''|\s*$)\S', negate: true}
      # Chưa viết mã: mã và ticket giữ nguyên, không tệp mới ngoài thư mục kế hoạch.
      - {kind: unchanged, path: src/api.py}
      - {kind: unchanged, path: docs/work/tickets/API-02.md}
      - {kind: no_new_files_outside, prefixes: ["docs/work/plans/"]}
    oracle:
      files:
        docs/work/plans/PLAN-API-02.md: |
          ---
          id: PLAN-API-02
          kind: plan
          ticket: API-02
          status: proposed
          author_role: R3
          approved_by: null
          ---
          # Kế hoạch API-02 — Thêm endpoint xem đơn hàng

          ## Hiểu yêu cầu
          GET /orders/{id}; người không phải chủ đơn nhận 404 (không lộ đơn tồn tại). Không đổi schema.

          ## Các bước
          1. Test: chủ đơn nhận 200, người khác nhận 404 — đỏ vì endpoint chưa có.
          2. Thêm route trong src/api.py.

          ## Cách kiểm
          `python -m pytest tests/test_api.py -q`
